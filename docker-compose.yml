services:
  postgres:
    image: postgres:16-alpine
    container_name: chronos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chronos_billing
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: chronos_dev_password
    ports:
      - "5433:5432"
    volumes:
      - chronos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos -d chronos_billing"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chronos_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chronos_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/var/www/app:cached
    networks:
      - chronos_net

  nginx:
    image: nginx:1.27-alpine
    container_name: chronos_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/app:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - chronos_net

  # Dedicated worker consuming the async transport (Symfony Messenger).
  # Scale this independently of the HTTP tier under load:
  #   docker compose up --scale messenger-worker=3
  messenger-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chronos_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .:/var/www/app:cached
    command: >
      php bin/console messenger:consume async
      --time-limit=3600 --memory-limit=128M -vv
    networks:
      - chronos_net

volumes:
  chronos_pgdata:

networks:
  chronos_net:
    driver: bridge
